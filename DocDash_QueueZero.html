      // ============================================================================
      // 2. DOMAIN SERVICE LAYER (EWMA Queue Engine, Geo Check-In & SMS Gateway)
      // ============================================================================
      const QueueService = {
        calculateEWMA(durations, fallback) {
          if (!Array.isArray(durations) || durations.length === 0) return fallback;
          const recent = durations.slice(-5);
          let ewma = recent[0];
          for (let i = 1; i < recent.length; i++) {
            ewma = EWMA_ALPHA * recent[i] + (1 - EWMA_ALPHA) * ewma;
          }
          return Math.max(1, Math.round(ewma));
        },

        getDistanceMeters(lat1, lon1, lat2, lon2) {
          const R = 6371e3;
          const toRad = (deg) => (deg * Math.PI) / 180;
          const dLat = toRad(lat2 - lat1);
          const dLon = toRad(lon2 - lon1);
          const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) *
              Math.cos(toRad(lat2)) *
              Math.sin(dLon / 2) *
              Math.sin(dLon / 2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return Math.round(R * c);
        },

        normalizeDoctorShifts(doc) {
          const validShifts = Array.isArray(doc.shifts)
            ? doc.shifts.filter((s) => DEFAULT_SHIFTS.includes(s))
            : [];
          return {
            ...doc,
            shifts: validShifts.length > 0 ? validShifts : ['Morning']
          };
        },

        sortWaitingQueue(list) {
          return [...list].sort(
            (a, b) =>
              (b.is_emergency ? 1 : 0) - (a.is_emergency ? 1 : 0) ||
              a.token_number - b.token_number
          );
        },

        buildEnrichedDoctors(rawDoctors, tokens, clinics = SEED_CLINICS) {
          return rawDoctors.map((rawDoc) => {
            const doc = this.normalizeDoctorShifts(rawDoc);
            const clinic = clinics.find((c) => c.id === doc.clinic_id) || clinics[0];
            const docTokens = tokens.filter((t) => t.doctor_id === doc.id);
            const activeToken = docTokens.find((t) => t.state === 'Active') || null;
            const waitingTokens = this.sortWaitingQueue(
              docTokens.filter((t) => t.state === 'Waiting')
            );
            const nextToken = waitingTokens[0] || null;
            const dynamicAvg = this.calculateEWMA(doc.recent_durations, doc.base_avg_mins);

            return {
              ...doc,
              clinic_name: clinic.name,
              clinic_address: clinic.address,
              clinic_lat: clinic.lat,
              clinic_lng: clinic.lng,
              dynamic_avg_mins: dynamicAvg,
              active_token: activeToken,
              next_token: nextToken,
              waiting_count: waitingTokens.length
            };
          });
        },

        buildEnrichedTokens(tokens, enrichedDoctors) {
          return tokens.map((token) => {
            const doc =
              enrichedDoctors.find((d) => d.id === token.doctor_id) || enrichedDoctors[0];
            const sameQueue = tokens.filter(
              (t) => t.doctor_id === token.doctor_id && t.shift === token.shift
            );
            const activeToken = sameQueue.find((t) => t.state === 'Active');
            const waitingOrdered = this.sortWaitingQueue(
              sameQueue.filter((t) => t.state === 'Waiting')
            );

            let patientsAhead = 0;
            if (token.state === 'Waiting') {
              const idx = waitingOrdered.findIndex((t) => t.id === token.id);
              const activeAhead = activeToken ? 1 : 0;
              patientsAhead = idx >= 0 ? idx + activeAhead : 0;
            }

            const avgMins = doc ? doc.dynamic_avg_mins : 12;
            const delayMins = doc ? doc.offset_delay_mins : 0;
            const estimatedWaitMins =
              token.state === 'Waiting'
                ? Math.max(0, patientsAhead * avgMins + delayMins)
                : 0;

            const amberAlert =
              token.state === 'Waiting' && patientsAhead > 0 && patientsAhead <= 2;

            return {
              ...token,
              doctor_name: doc ? doc.name : 'Assigned Physician',
              specialty: doc ? doc.specialty : 'General Medicine',
              clinic_name: doc ? doc.clinic_name : 'Clinic Branch',
              clinic_lat: doc ? doc.clinic_lat : 17.4126,
              clinic_lng: doc ? doc.clinic_lng : 78.4392,
              doctor_status: doc ? doc.status : 'In Consultation',
              active_token_number: activeToken ? activeToken.token_number : null,
              patients_ahead: patientsAhead,
              estimated_wait_mins: estimatedWaitMins,
              amber_alert: amberAlert
            };
          });
        },

        appendProximitySmsLogs(nextDoctors, nextTokens, existingLogs, clinics = SEED_CLINICS) {
          const newLogs = [...existingLogs];
          const updatedTokens = nextTokens.map((tok) => {
            if (tok.state !== 'Waiting' || tok.sms_sent) return tok;
            const doc = nextDoctors.find((d) => d.id === tok.doctor_id);
            if (!doc) return tok;
            const clinic = clinics.find((c) => c.id === doc.clinic_id) || clinics[0];
            const sameQueue = nextTokens.filter(
              (t) => t.doctor_id === tok.doctor_id && t.shift === tok.shift
            );
            const activeToken = sameQueue.find((t) => t.state === 'Active');
            const waitingOrdered = this.sortWaitingQueue(
              sameQueue.filter((t) => t.state === 'Waiting')
            );
            const idx = waitingOrdered.findIndex((t) => t.id === tok.id);
            const patientsAhead = idx >= 0 ? idx + (activeToken ? 1 : 0) : 0;
            const avgMins = this.calculateEWMA(doc.recent_durations, doc.base_avg_mins);
            const estWait = Math.max(
              0,
              patientsAhead * avgMins + (doc.offset_delay_mins || 0)
            );

            if (patientsAhead > 0 && patientsAhead <= 2) {
              newLogs.unshift({
                id: `${Date.now()}-${tok.id}-${Math.random().toString(36).slice(2, 6)}`,
                time: new Date().toLocaleTimeString([], {
                  hour: '2-digit',
                  minute: '2-digit',
                  second: '2-digit'
                }),
                patient_name: tok.patient_name,
                phone: tok.patient_phone,
                message: `DocDash Alert: Token #${tok.token_number} for ${doc.name} is ${patientsAhead} patient(s) away (Est. ${estWait} mins). Please arrive at ${clinic.name} now!`
              });
              return { ...tok, sms_sent: true };
            }
            return tok;
          });

          return { updatedTokens, updatedLogs: newLogs.slice(0, 20) };
        }
      };

      // ============================================================================
      // 3. STATE PERSISTENCE & CROSS-TAB SYNC ENGINE (LocalStorage + BroadcastChannel)
      // ============================================================================
      const SyncBus = {
        createSeedState() {
          return {
            doctors: JSON.parse(JSON.stringify(SEED_DOCTORS)),
            tokens: JSON.parse(JSON.stringify(SEED_TOKENS)),
            smsLogs: [],
            nextTokenId: 201,
            nextDoctorId: 9
          };
        },

        loadInitialState() {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              return {
                doctors: (parsed.doctors || SEED_DOCTORS).map((d) =>
                  QueueService.normalizeDoctorShifts(d)
                ),
                tokens: parsed.tokens || SEED_TOKENS,
                smsLogs: parsed.smsLogs || [],
                nextTokenId: parsed.nextTokenId || 201,
                nextDoctorId: parsed.nextDoctorId || 9
              };
            }
          } catch (e) {
            console.warn('Could not read localStorage:', e);
          }
          return SyncBus.createSeedState();
        },

        persistAndBroadcast(nextState) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
          } catch (e) {
            console.warn('Could not write localStorage:', e);
          }
          try {
            if (typeof BroadcastChannel !== 'undefined') {
              const bc = new BroadcastChannel(CHANNEL_NAME);
              bc.postMessage({ type: 'STATE_UPDATE', payload: nextState });
              bc.close();
            }
          } catch (e) {
            // Ignore sandboxed frame restrictions
          }
        },

        subscribe(onRemoteState) {
          const onStorage = (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
              try {
                onRemoteState(JSON.parse(e.newValue));
              } catch (err) {
                console.warn('Failed to parse storage event:', err);
              }
            }
          };
          window.addEventListener('storage', onStorage);

          let bc = null;
          try {
            if (typeof BroadcastChannel !== 'undefined') {
              bc = new BroadcastChannel(CHANNEL_NAME);
              bc.onmessage = (event) => {
                if (event.data && event.data.type === 'STATE_UPDATE' && event.data.payload) {
                  onRemoteState(event.data.payload);
                }
              };
            }
          } catch (e) {
            // Ignore if BroadcastChannel is unavailable
          }

          return () => {
            window.removeEventListener('storage', onStorage);
            if (bc) bc.close();
          };
        }
      };

      // ============================================================================
      // 4. THEME CONTROLLER (System/Saved Detection + DOM & Storage Sync)
      // ============================================================================
      const ThemeController = {
        getInitialTheme() {
          try {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            if (savedTheme === 'dark' || savedTheme === 'light') {
              return savedTheme;
            }
            if (
              typeof window !== 'undefined' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            ) {
              return 'dark';
            }
          } catch (err) {
            console.warn('Could not read initial theme preference:', err);
          }
          return 'light';
        },

        applyTheme(theme) {
          const isDark = theme === 'dark';
          try {
            localStorage.setItem(THEME_STORAGE_KEY, theme);
          } catch (err) {
            console.warn('Could not persist theme preference:', err);
          }
          if (typeof document !== 'undefined') {
            document.documentElement.classList.toggle('dark', isDark);
            document.body.className = isDark
              ? 'bg-slate-950 text-slate-100 font-sans antialiased'
              : 'bg-slate-50 text-slate-900 font-sans antialiased';
          }
        },

        getTokens(isDark) {
          return {
            isDark,
            surfaceCard: isDark
              ? 'bg-slate-900 border-slate-800 text-slate-100'
              : 'bg-white border-slate-200 text-slate-900',
            subtleText: isDark ? 'text-slate-400' : 'text-slate-500',
            inputStyle: isDark
              ? 'border-slate-700 bg-slate-800 text-slate-100 placeholder-slate-400 focus:border-teal-400'
              : 'border-slate-300 bg-white text-slate-900 placeholder-slate-400 focus:border-teal-500',
            statusBadge(status) {
              if (status === 'In Consultation') {
                return isDark
                  ? 'bg-emerald-950/80 text-emerald-300 border-emerald-800'
                  : 'bg-emerald-100 text-emerald-800 border-emerald-200';
              }
              if (status === 'On Break') {
                return isDark
                  ? 'bg-amber-950/80 text-amber-300 border-amber-800'
                  : 'bg-amber-100 text-amber-800 border-amber-200';
              }
              return isDark
                ? 'bg-rose-950/80 text-rose-300 border-rose-800'
                : 'bg-rose-100 text-rose-800 border-rose-200';
            }
          };
        }
      };

      // ============================================================================
      // 5. CUSTOM INFRASTRUCTURE HOOKS (useClinicStore & useThemeController)
      // ============================================================================
      function useThemeController() {
        const [theme, setTheme] = useState(ThemeController.getInitialTheme);
        const isDark = theme === 'dark';

        useEffect(() => {
          ThemeController.applyTheme(theme);
        }, [theme]);

        const toggleTheme = () => {
          setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
        };

        const ui = useMemo(() => ThemeController.getTokens(isDark), [isDark]);
        return { theme, isDark, toggleTheme, ui };
      }

      function useClinicStore() {
        const [store, setStore] = useState(SyncBus.loadInitialState);
        const storeRef = useRef(store);
        storeRef.current = store;

        const commitStore = (updater) => {
          setStore((prev) => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            SyncBus.persistAndBroadcast(next);
            return next;
          });
        };

        useEffect(() => SyncBus.subscribe(setStore), []);

        const enrichedDoctors = useMemo(
          () => QueueService.buildEnrichedDoctors(store.doctors, store.tokens, SEED_CLINICS),
          [store.doctors, store.tokens]
        );

        const enrichedTokens = useMemo(
          () => QueueService.buildEnrichedTokens(store.tokens, enrichedDoctors),
          [store.tokens, enrichedDoctors]
        );

        const bookToken = ({ doctorId, shift, patientName, patientPhone }) => {
          const targetDoc =
            storeRef.current.doctors.find((d) => d.id === Number(doctorId)) ||
            SEED_DOCTORS[0];
          const allowedShifts = QueueService.normalizeDoctorShifts(targetDoc).shifts;
          const chosenShift = allowedShifts.includes(shift) ? shift : allowedShifts[0];
          const createdId = storeRef.current.nextTokenId;

          commitStore((prev) => {
            const shiftTokens = prev.tokens.filter(
              (t) => t.doctor_id === targetDoc.id && t.shift === chosenShift
            );
            const nextTokenNum =
              shiftTokens.reduce((max, t) => Math.max(max, t.token_number), 0) + 1;

            const newToken = {
              id: createdId,
              doctor_id: targetDoc.id,
              shift: chosenShift,
              token_number: nextTokenNum,
              patient_name: patientName.trim(),
              patient_phone: patientPhone.trim() || '+91-9800000000',
              state: 'Waiting',
              is_emergency: false,
              checked_in: false,
              sms_sent: false,
              prescription: '',
              created_at: new Date().toISOString()
            };

            const { updatedTokens, updatedLogs } = QueueService.appendProximitySmsLogs(
              prev.doctors,
              [...prev.tokens, newToken],
              prev.smsLogs,
              SEED_CLINICS
            );

            return {
              ...prev,
              tokens: updatedTokens,
              smsLogs: updatedLogs,
              nextTokenId: prev.nextTokenId + 1
            };
          });

          return createdId;
        };

        const callNextPatient = (doctorId) => {
          commitStore((prev) => {
            const doctorsCopy = prev.doctors.map((d) => ({ ...d }));
            const doc = doctorsCopy.find((d) => d.id === Number(doctorId));
            if (!doc) return prev;

            const tokensCopy = prev.tokens.map((t) => ({ ...t }));
            const currentActive = tokensCopy.find(
              (t) => t.doctor_id === doc.id && t.state === 'Active'
            );
            if (currentActive) {
              currentActive.state = 'Completed';
              currentActive.completed_at = new Date().toISOString();
              const simulatedDuration = Math.max(
                5,
                doc.base_avg_mins + Math.floor(Math.random() * 5) - 2
              );
              doc.recent_durations = [...(doc.recent_durations || []), simulatedDuration];
            }

            const nextWaiting = QueueService.sortWaitingQueue(
              tokensCopy.filter((t) => t.doctor_id === doc.id && t.state === 'Waiting')
            )[0];

            if (nextWaiting) {
              nextWaiting.state = 'Active';
              nextWaiting.started_at = new Date().toISOString();
              doc.status = 'In Consultation';
            }

            const { updatedTokens, updatedLogs } = QueueService.appendProximitySmsLogs(
              doctorsCopy,
              tokensCopy,
              prev.smsLogs,
              SEED_CLINICS
            );

            return {
              ...prev,
              doctors: doctorsCopy,
              tokens: updatedTokens,
              smsLogs: updatedLogs
            };
          });
        };

        const skipAbsentPatient = (doctorId) => {
          commitStore((prev) => {
            const doctorsCopy = prev.doctors.map((d) => ({ ...d }));
            const doc = doctorsCopy.find((d) => d.id === Number(doctorId));
            if (!doc) return prev;

            const tokensCopy = prev.tokens.map((t) => ({ ...t }));
            const currentActive = tokensCopy.find(
              (t) => t.doctor_id === doc.id && t.state === 'Active'
            );
            if (currentActive) {
              currentActive.state = 'Absent';
            }

            const nextWaiting = QueueService.sortWaitingQueue(
              tokensCopy.filter((t) => t.doctor_id === doc.id && t.state === 'Waiting')
            )[0];

            if (nextWaiting) {
              nextWaiting.state = 'Active';
              nextWaiting.started_at = new Date().toISOString();
            }

            const { updatedTokens, updatedLogs } = QueueService.appendProximitySmsLogs(
              doctorsCopy,
              tokensCopy,
              prev.smsLogs,
              SEED_CLINICS
            );

            return {
              ...prev,
              doctors: doctorsCopy,
              tokens: updatedTokens,
              smsLogs: updatedLogs
            };
          });
        };

        const requeueAbsent = (tokenId) => {
          commitStore((prev) => {
            const tokensCopy = prev.tokens.map((t) =>
              t.id === tokenId ? { ...t, state: 'Waiting', sms_sent: false } : t
            );
            const { updatedTokens, updatedLogs } = QueueService.appendProximitySmsLogs(
              prev.doctors,
              tokensCopy,
              prev.smsLogs,
              SEED_CLINICS
            );
            return {
              ...prev,
              tokens: updatedTokens,
              smsLogs: updatedLogs
            };
          });
        };

        const updateDoctorStatusOrDelay = (doctorId, { status, addDelayMins = 0 }) => {
          commitStore((prev) => ({
            ...prev,
            doctors: prev.doctors.map((d) => {
              if (d.id !== Number(doctorId)) return d;
              const nextDelay = Math.max(0, (d.offset_delay_mins || 0) + addDelayMins);
              return {
                ...d,
                status: addDelayMins > 0 ? 'Delayed' : status || d.status,
                offset_delay_mins: nextDelay
              };
            })
          }));
        };

        const savePrescription = (tokenId, noteText) => {
          const trimmed = noteText.trim();
          if (!trimmed) return false;
          commitStore((prev) => ({
            ...prev,
            tokens: prev.tokens.map((t) =>
              t.id === tokenId ? { ...t, prescription: trimmed } : t
            )
          }));
          return true;
        };

        const injectEmergencyToken = ({ doctorId, shift, patientName }) => {
          commitStore((prev) => {
            const doctorsCopy = prev.doctors.map((d) => ({ ...d }));
            const doc = doctorsCopy.find((d) => d.id === Number(doctorId));
            if (!doc) return prev;

            const shiftTokens = prev.tokens.filter(
              (t) => t.doctor_id === doc.id && t.shift === shift
            );
            const maxTokenNum = shiftTokens.reduce(
              (max, t) => Math.max(max, t.token_number),
              0
            );

            const urgentToken = {
              id: prev.nextTokenId,
              doctor_id: doc.id,
              shift,
              token_number: maxTokenNum + 1,
              patient_name: `[EMERGENCY] ${patientName.trim()}`,
              patient_phone: '+91-9110000911',
              state: 'Waiting',
              is_emergency: true,
              checked_in: true,
              sms_sent: false,
              prescription: '',
              created_at: new Date().toISOString()
            };

            doc.offset_delay_mins = (doc.offset_delay_mins || 0) + 5;

            const { updatedTokens, updatedLogs } = QueueService.appendProximitySmsLogs(
              doctorsCopy,
              [...prev.tokens, urgentToken],
              prev.smsLogs,
              SEED_CLINICS
            );

            return {
              ...prev,
              doctors: doctorsCopy,
              tokens: updatedTokens,
              smsLogs: updatedLogs,
              nextTokenId: prev.nextTokenId + 1
            };
          });
        };

        const upsertDoctorProfile = (editingId, formValues) => {
          const normalizedShifts =
            formValues.shifts.length > 0 ? formValues.shifts : ['Morning'];

          if (editingId !== null) {
            commitStore((prev) => ({
              ...prev,
              doctors: prev.doctors.map((d) =>
                d.id === editingId
                  ? {
                      ...d,
                      name: formValues.name.trim(),
                      specialty: formValues.specialty,
                      qualification: formValues.qualification.trim() || 'MBBS, MD',
                      clinic_id: Number(formValues.clinic_id),
                      fee: Math.max(100, Number(formValues.fee) || 500),
                      base_avg_mins: Math.max(
                        5,
                        Math.min(45, Number(formValues.base_avg_mins) || 12)
                      ),
                      status: formValues.status,
                      shifts: normalizedShifts
                    }
                  : d
              )
            }));
            return {
              createdId: editingId,
              message: `Updated ${formValues.name.trim()} and shift schedule (${normalizedShifts.join(' & ')}).`
            };
          }

          const createdDocId = storeRef.current.nextDoctorId || 9;
          commitStore((prev) => {
            const avgMins = Math.max(
              5,
              Math.min(45, Number(formValues.base_avg_mins) || 12)
            );
            const newDoctor = {
              id: createdDocId,
              clinic_id: Number(formValues.clinic_id),
              name: formValues.name.trim(),
              specialty: formValues.specialty,
              qualification: formValues.qualification.trim() || 'MBBS, MD',
              fee: Math.max(100, Number(formValues.fee) || 500),
              base_avg_mins: avgMins,
              recent_durations: [avgMins, avgMins, avgMins],
              status: formValues.status,
              offset_delay_mins: 0,
              shifts: normalizedShifts
            };
            return {
              ...prev,
              doctors: [...prev.doctors, newDoctor],
              nextDoctorId: createdDocId + 1
            };
          });

          return {
            createdId: createdDocId,
            message: `Added ${formValues.name.trim()} with ${normalizedShifts.join(' & ')} shift coverage.`
          };
        };

        const toggleDoctorShift = (docId, shiftName) => {
          commitStore((prev) => ({
            ...prev,
            doctors: prev.doctors.map((d) => {
              if (d.id !== docId) return d;
              const current = QueueService.normalizeDoctorShifts(d).shifts;
              const hasShift = current.includes(shiftName);
              if (hasShift && current.length === 1) return d;
              const nextShifts = hasShift
                ? current.filter((s) => s !== shiftName)
                : [...current, shiftName];
              return { ...d, shifts: nextShifts };
            })
          }));
        };

        const markTokenCheckedIn = (tokenId) => {
          commitStore((prev) => ({
            ...prev,
            tokens: prev.tokens.map((t) =>
              t.id === tokenId ? { ...t, checked_in: true } : t
            )
          }));
        };

        const resetDemoState = () => {
          const fresh = SyncBus.createSeedState();
          commitStore(fresh);
          return fresh;
        };

        return {
          store,
          enrichedDoctors,
          enrichedTokens,
          bookToken,
          callNextPatient,
          skipAbsentPatient,
          requeueAbsent,
          updateDoctorStatusOrDelay,
          savePrescription,
          injectEmergencyToken,
          upsertDoctorProfile,
          toggleDoctorShift,
          markTokenCheckedIn,
          resetDemoState
        };
      }

      function PatientTrackerPanel({
        enrichedTokens,
        trackedToken,
        setTrackedTokenId,
        smsLogs,
        onMarkCheckedIn,
        ui
      }) {
        const [geoStatus, setGeoStatus] = useState({ type: '', text: '' });
        const { isDark, surfaceCard, subtleText } = ui;

        const handleGeoCheckIn = (token, simulateWithinRange = false) => {
          setGeoStatus({ type: 'info', text: 'Checking distance to clinic...' });

          const verifyCoords = (lat, lng, isSimulated = false) => {
            const distanceMeters = isSimulated
              ? 120
              : QueueService.getDistanceMeters(lat, lng, token.clinic_lat, token.clinic_lng);

            if (distanceMeters <= MAX_CHECKIN_RADIUS_METERS) {
              onMarkCheckedIn(token.id);
              setGeoStatus({
                type: 'success',
                text: `Checked in! Verified ${distanceMeters}m from ${token.clinic_name} (within 500m).`
              });
            } else {
              setGeoStatus({
                type: 'error',
                text: `You are ${distanceMeters}m away from ${token.clinic_name}. Move within 500m to check in.`
              });
            }
          };

          if (simulateWithinRange) {
            verifyCoords(token.clinic_lat, token.clinic_lng, true);
            return;
          }

          if (typeof navigator === 'undefined' || !navigator.geolocation) {
            setGeoStatus({
              type: 'error',
              text: 'Geolocation unavailable. Use "Simulate <500m Arrival" for demo.'
            });
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              verifyCoords(position.coords.latitude, position.coords.longitude, false);
            },
            () => {
              setGeoStatus({
                type: 'error',
                text: 'Location permission denied. Use "Simulate <500m Arrival" for demo.'
              });
            }
          );
        };

        return (
          <div className="space-y-5">
            <div className={`p-5 rounded-2xl shadow-sm border ${surfaceCard}`}>
              <div className="flex items-center justify-between gap-2 mb-3">
                <h2 className="font-bold text-base flex items-center gap-2">
                  <Icon name="bell" className="w-4 h-4 text-teal-500" /> My Live Token Tracker
                </h2>
                <select
                  value={trackedToken ? trackedToken.id : ''}
                  onChange={(e) => {
                    setTrackedTokenId(Number(e.target.value));
                    setGeoStatus({ type: '', text: '' });
                  }}
                  className={`text-xs border rounded-lg px-2 py-1.5 max-w-[190px] ${
                    isDark
                      ? 'border-slate-700 bg-slate-800 text-slate-200'

              </div>

              {trackedToken && (
                <div className="space-y-4">
                  {trackedToken.amber_alert && (
                    <div
                      className={`border-l-4 border-amber-500 p-3.5 rounded-r-xl animate-pulse ${
                        isDark ? 'bg-amber-950/60 text-amber-200' : 'bg-amber-50 text-amber-950'
                      }`}
                    >
                      <p
                        className={`text-[11px] font-extrabold uppercase tracking-wider ${
                          isDark ? 'text-amber-300' : 'text-amber-800'

                      >
                        Proximity Alert • {trackedToken.patients_ahead} Patients Ahead
                      </p>
                      <p className="text-sm font-bold mt-0.5">
                        Please arrive at the clinic now! Your turn is coming up soon.

                  <div className="bg-slate-900 text-white rounded-xl p-4 border border-slate-800">
                    <div className="flex justify-between items-start gap-2">
                      <div>
                        <span className="text-[11px] uppercase tracking-wider text-slate-400 block">
                          Your Token
                        </span>
                        <span className="text-4xl font-black text-teal-400 block">
                          #{trackedToken.token_number}

                      <div className="text-right">

                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-800 grid grid-cols-2 gap-2.5 text-center">

                    {!trackedToken.checked_in && (

                        <button

                        >
                          Simulate &lt;500m Arrival
                        </button>
                      </div>
                    )}

                    {geoStatus.text && (
                      <p
                        className={`text-xs mt-2 font-medium ${
                          geoStatus.type === 'success'
                            ? isDark
                              ? 'text-emerald-400'
                              : 'text-emerald-700'
                            : geoStatus.type === 'error'
                            ? isDark
                              ? 'text-rose-400'
                              : 'text-rose-600'
                            : subtleText
                        }`}
                      >
                        {geoStatus.text}
                      </p>
                    )}
                  </div>

                  {trackedToken.prescription && (
                    <div
                      className={`border rounded-xl p-3.5 ${
                        isDark
                          ? 'bg-emerald-950/50 border-emerald-800'
                          : 'bg-emerald-50 border-emerald-200'

                      </p>

                </h3>

                    isDark ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-600'

                <div className="space-y-2.5 max-h-56 overflow-y-auto pr-1">

      function DoctorConsolePanel({
        enrichedDoctors,
        enrichedTokens,
        selectedDoctorId,
        setSelectedDoctorId,
        onEditDoctor,
        onUpdateStatusOrDelay,
        onCallNext,
        onSkipAbsent,
        onRequeueAbsent,
        onSavePrescription,
        ui
      }) {
        const [rxInput, setRxInput] = useState('');
        const [rxSavedNotice, setRxSavedNotice] = useState('');
        const { isDark, surfaceCard, subtleText, inputStyle } = ui;

        const consoleDoctor =
          enrichedDoctors.find((d) => d.id === Number(selectedDoctorId)) || enrichedDoctors[0];
        if (!consoleDoctor) return null;

        const consoleTokens = enrichedTokens
          .filter((t) => t.doctor_id === consoleDoctor.id)
          .sort((a, b) => a.token_number - b.token_number);

        const targetRxToken =
          consoleDoctor.active_token ||
          [...consoleTokens].reverse().find((t) => t.state === 'Completed');
        const docShifts = QueueService.normalizeDoctorShifts(consoleDoctor).shifts;

        const handleAttach = () => {
          if (!targetRxToken || !rxInput.trim()) return;
          const ok = onSavePrescription(targetRxToken.id, rxInput);
          if (ok) {
            setRxInput('');
            setRxSavedNotice(`Prescription attached to Token #${targetRxToken.token_number}.`);
            setTimeout(() => setRxSavedNotice(''), 3500);
          }
        };

        return (
          <div className="space-y-5">
            <div className={`p-5 rounded-2xl shadow-sm border ${surfaceCard}`}>
              <div
                className={`flex flex-wrap items-center justify-between gap-3 pb-4 border-b ${
                  isDark ? 'border-slate-800' : 'border-slate-200'

                      onChange={(e) => setSelectedDoctorId(Number(e.target.value))}

                        isDark
                          ? 'border-slate-700 bg-slate-800 text-slate-100'
                          : 'border-slate-300 bg-slate-50 text-slate-900'
                      }`}

                      {enrichedDoctors.map((d) => (

                          {d.name} — {d.specialty} ({d.clinic_name})
                        </option>
                      ))}

                      type="button"
                      onClick={() => onEditDoctor(consoleDoctor)}
                      className={`text-xs font-semibold border px-3 py-2 rounded-xl transition ${
                        isDark
                          ? 'text-indigo-300 bg-indigo-950/70 hover:bg-indigo-900/70 border-indigo-800'
                          : 'text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border-indigo-200'
                      }`}
                    >
                      Edit Profile &amp; Shifts
                    </button>
                  </div>
                  <div

                      isDark ? 'text-slate-300' : 'text-slate-600'
                    }`}
                  >
                    <span className={`font-semibold ${isDark ? 'text-slate-100' : 'text-slate-800'}`}>
                      {consoleDoctor.clinic_name}
                    </span>
                    <span>•</span>
                    <span>Assigned Shifts:</span>
                    {docShifts.map((sh) => (
                      <span
                        key={sh}
                        className={`text-[11px] font-bold border px-2 py-0.5 rounded-full ${
                          isDark
                            ? 'bg-indigo-950/80 text-indigo-300 border-indigo-800'
                            : 'bg-indigo-50 text-indigo-700 border-indigo-200'
                        }`}

        useEffect(() => {
          if (editingDoctorId === null) {
            setDoctorForm(EMPTY_DOCTOR_FORM);
            return;
          }
          const target = enrichedDoctors.find((d) => d.id === editingDoctorId);
          if (target) {
            setDoctorForm({
              name: target.name,
              specialty: target.specialty,
              qualification: target.qualification,
              clinic_id: target.clinic_id,
              fee: target.fee,
              base_avg_mins: target.base_avg_mins,

            setDoctorFormMessage('');

        const toggleFormShift = (shiftName) => {
          setDoctorForm((prev) => {
            const exists = prev.shifts.includes(shiftName);
            if (exists && prev.shifts.length === 1) return prev;
            const nextShifts = exists
              ? prev.shifts.filter((s) => s !== shiftName)
              : [...prev.shifts, shiftName];
            return { ...prev, shifts: nextShifts };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!doctorForm.name.trim()) return;
          const result = onUpsertDoctor(editingDoctorId, doctorForm);

                              ? 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800'

                          }`}
                        >
                          <div className="text-xs font-extrabold">{shiftName} Shift</div>
                          <div
                            className={`text-[10px] mt-0.5 ${
                              active ? 'text-indigo-100' : subtleText
                            }`}
                          >
                            {shiftName === 'Morning' ? '9 AM – 1 PM' : '5 PM – 9 PM'}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="pt-1 flex gap-2">
                  <button

                    className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-xl shadow-sm transition"

                    onClick={onClose}
                    className={`px-4 py-2 text-xs font-semibold rounded-xl ${
                      isDark ? 'text-slate-300 hover:bg-slate-800' : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 text-xs font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-xl flex items-center gap-1.5 shadow-sm"
                  >
                    <Icon name="checkCircle" className="w-4 h-4" /> Confirm Virtual Token
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ============================================================================
      // 7. ROOT SHELL (Composes Infrastructure Hooks & Portal Views)
      // ============================================================================
      function App() {
        const { isDark, toggleTheme, ui } = useThemeController();
        const {
          store,
          enrichedDoctors,
          enrichedTokens,
          bookToken,
          callNextPatient,
          skipAbsentPatient,
          requeueAbsent,
          updateDoctorStatusOrDelay,
          savePrescription,
          injectEmergencyToken,
          upsertDoctorProfile,
          toggleDoctorShift,
          markTokenCheckedIn,
          resetDemoState
        } = useClinicStore();

        const [activePortal, setActivePortal] = useState('patient_portal');
        const [patientTab, setPatientTab] = useState('directory');
        const [doctorTab, setDoctorTab] = useState('consultation');

        const [selectedClinic, setSelectedClinic] = useState('all');
        const [selectedSpecialty, setSelectedSpecialty] = useState('all');
        const [bookingDoctor, setBookingDoctor] = useState(null);
        const [trackedTokenId, setTrackedTokenId] = useState(105);
        const [selectedDoctorId, setSelectedDoctorId] = useState(1);
        const [editingDoctorId, setEditingDoctorId] = useState(null);

        const filteredDoctors = useMemo(
          () =>
            enrichedDoctors.filter((doc) => {
              const matchClinic =
                selectedClinic === 'all' || doc.clinic_id === Number(selectedClinic);
              const matchSpec =
                selectedSpecialty === 'all' || doc.specialty === selectedSpecialty;
              return matchClinic && matchSpec;
            }),
          [enrichedDoctors, selectedClinic, selectedSpecialty]
        );

        const trackedToken =
          enrichedTokens.find((t) => t.id === trackedTokenId) ||
          enrichedTokens.find((t) => t.state === 'Waiting') ||
          enrichedTokens[0];

        const consoleDoctor =
          enrichedDoctors.find((d) => d.id === Number(selectedDoctorId)) || enrichedDoctors[0];

        const handleConfirmBooking = (payload) => {
          const newId = bookToken(payload);
          setTrackedTokenId(newId);
          setBookingDoctor(null);
        };

        const handleEditDoctorFromConsole = (doc) => {
          setEditingDoctorId(doc.id);
          setActivePortal('doctor_portal');
          setDoctorTab('roster_shifts');
        };

        const handleUpsertDoctorWithSelection = (editingId, formValues) => {
          const res = upsertDoctorProfile(editingId, formValues);
          if (editingId === null && res.createdId) {
            setSelectedDoctorId(res.createdId);
          }
          return res;
        };

        const handleResetDemo = () => {
          resetDemoState();
          setTrackedTokenId(105);
          setSelectedDoctorId(1);
          setEditingDoctorId(null);
        };

        const { surfaceCard, subtleText, inputStyle } = ui;

        return (
          <div
            className={`min-h-screen flex flex-col transition-colors ${
              isDark ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'
            }`}
          >
            <TopPortalHeader
              activePortal={activePortal}
              setActivePortal={setActivePortal}
              patientTab={patientTab}
              setPatientTab={setPatientTab}
              doctorTab={doctorTab}
              setDoctorTab={setDoctorTab}
              consoleDoctor={consoleDoctor}
              isDark={isDark}
              toggleTheme={toggleTheme}
              onResetDemo={handleResetDemo}
            />

            <main className="max-w-7xl w-full mx-auto px-4 py-6 flex-1">
              {activePortal === 'patient_portal' && patientTab === 'directory' && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 space-y-5">
                    <div className={`p-5 rounded-2xl shadow-sm border ${surfaceCard}`}>
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
                        <div>
                          <h2 className="text-lg font-extrabold">Multi-Clinic Doctor Directory</h2>
                          <p className={`text-xs ${subtleText}`}>
                            Filter across 4 branches &amp; 4 specialties to book an instant virtual token
                          </p>
                        </div>

                        <div className="flex flex-wrap gap-2">
                          <select
                            value={selectedClinic}
                            onChange={(e) => setSelectedClinic(e.target.value)}
                            className={`text-xs font-medium border rounded-xl px-3 py-2 ${inputStyle}`}
                          >
                            <option value="all">All Clinics (4 Branches)</option>
                            {SEED_CLINICS.map((c) => (
                              <option key={c.id} value={c.id}>
                                {c.name}
                              </option>
                            ))}
                          </select>

                          <select
                            value={selectedSpecialty}
                            onChange={(e) => setSelectedSpecialty(e.target.value)}
                            className={`text-xs font-medium border rounded-xl px-3 py-2 ${inputStyle}`}
                          >
                            <option value="all">All Specialties</option>
                            {SPECIALTIES.map((sp) => (
                              <option key={sp} value={sp}>
                                {sp}
                              </option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredDoctors.map((doc) => {
                          const docShifts = QueueService.normalizeDoctorShifts(doc).shifts;
                          return (
                            <div
                              key={doc.id}
                              className={`border rounded-xl p-4 hover:border-teal-500 transition flex flex-col justify-between ${
                                isDark
                                  ? 'border-slate-800 bg-slate-800/50'
                                  : 'border-slate-200 bg-slate-50/60'
                              }`}
                            >
                              <div>
                                <div className="flex items-start justify-between gap-2">
                                  <div>
                                    <span
                                      className={`text-[11px] font-bold uppercase tracking-wider border px-2 py-0.5 rounded ${
                                        isDark
                                          ? 'text-teal-300 bg-teal-950/70 border-teal-800'
                                          : 'text-teal-700 bg-teal-50 border-teal-100'
                                      }`}
                                    >
                                      {doc.specialty}
                                    </span>
                                    <h3 className="font-bold text-base mt-1.5">{doc.name}</h3>
                                    <p className={`text-xs ${subtleText}`}>{doc.qualification}</p>
                                  </div>
                                  <span
                                    className={`text-[11px] font-semibold px-2.5 py-1 rounded-full border ${ui.statusBadge(
                                      doc.status
                                    )}`}
                                  >
                                    {doc.status}
                                  </span>
                                </div>

                                <div className="mt-2.5 flex flex-wrap gap-1.5">
                                  {docShifts.map((sh) => (
                                    <span
                                      key={sh}
                                      className={`text-[10px] font-bold border px-2 py-0.5 rounded-full ${
                                        isDark
                                          ? 'bg-indigo-950/70 text-indigo-300 border-indigo-800'
                                          : 'bg-indigo-50 text-indigo-700 border-indigo-200'
                                      }`}
                                    >
                                      {sh} ({sh === 'Morning' ? '9 AM – 1 PM' : '5 PM – 9 PM'})
                                    </span>
                                  ))}
                                </div>

                                <div
                                  className={`mt-3 space-y-1.5 text-xs ${
                                    isDark ? 'text-slate-300' : 'text-slate-600'
                                  }`}
                                >
                                  <p className="flex items-center gap-1.5">
                                    <Icon
                                      name="mapPin"
                                      className="w-3.5 h-3.5 text-slate-400 shrink-0"
                                    />
                                    <span>{doc.clinic_name}</span>
                                  </p>
                                  <p className="flex items-center gap-1.5">
                                    <Icon
                                      name="clock"
                                      className="w-3.5 h-3.5 text-slate-400 shrink-0"
                                    />
                                    <span>
                                      EWMA Pace: <strong>{doc.dynamic_avg_mins} mins/patient</strong>
                                      {doc.offset_delay_mins > 0 && (
                                        <span
                                          className={`font-semibold ml-1 ${
                                            isDark ? 'text-rose-400' : 'text-rose-600'
                                          }`}
                                        >
                                          (+{doc.offset_delay_mins}m delay)
                                        </span>
                                      )}
                                    </span>
                                  </p>
                                </div>
                              </div>

                              <div
                                className={`mt-4 pt-3 border-t flex items-center justify-between ${
                                  isDark ? 'border-slate-700/80' : 'border-slate-200'
                                }`}
                              >
                                <div>
                                  <span className={`text-[11px] block ${subtleText}`}>
                                    Now Serving
                                  </span>
                                  <span className="font-extrabold text-sm">
                                    {doc.active_token
                                      ? `Token #${doc.active_token.token_number}`
                                      : 'Ready'}
                                  </span>
                                  <span className={`text-xs ml-1.5 ${subtleText}`}>
                                    ({doc.waiting_count} waiting)
                                  </span>
                                </div>

                                <button
                                  onClick={() => setBookingDoctor(doc)}
                                  className="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm transition"
                                >
                                  Book Token • ₹{doc.fee}
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <div>
                    <PatientTrackerPanel
                      enrichedTokens={enrichedTokens}
                      trackedToken={trackedToken}
                      setTrackedTokenId={setTrackedTokenId}
                      smsLogs={store.smsLogs}
                      onMarkCheckedIn={markTokenCheckedIn}
                      ui={ui}
                    />
                  </div>
                </div>
              )}

              {activePortal === 'patient_portal' && patientTab === 'board' && (
                <div className="space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h2 className="text-xl font-extrabold">Live Waiting Room Queue Board</h2>
                      <p className={`text-xs ${subtleText}`}>
                        High-contrast outpatient lobby display across all 4 clinic branches
                      </p>
                    </div>
                    <span
                      className={`text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2 ${
                        isDark
                          ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800'
                          : 'bg-emerald-100 text-emerald-800'
                      }`}
                    >
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" /> Real-Time Telemetry
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {enrichedDoctors.map((doc) => {
                      const docShifts = QueueService.normalizeDoctorShifts(doc).shifts;
                      return (
                        <div
                          key={doc.id}
                          className="bg-slate-900 text-white rounded-2xl p-5 shadow-md border border-slate-800 flex flex-col justify-between"
                        >
                          <div>
                            <div className="flex justify-between items-start gap-2">
                              <span className="text-[11px] text-teal-400 font-bold uppercase tracking-wider">
                                {doc.specialty}
                              </span>
                              <span
                                className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${ui.statusBadge(
                                  doc.status
                                )}`}
                              >
                                {doc.status}
                              </span>
                            </div>
                            <h3 className="font-bold text-lg mt-1.5">{doc.name}</h3>
                            <p className="text-xs text-slate-400">{doc.clinic_name}</p>
                            <div className="mt-2 flex flex-wrap gap-1">
                              {docShifts.map((sh) => (
                                <span
                                  key={sh}
                                  className="text-[10px] font-semibold bg-slate-800 text-indigo-300 border border-slate-700 px-2 py-0.5 rounded"
                                >
                                  {sh}
                                </span>
                              ))}
                            </div>
                          </div>

                          <div className="my-5 bg-slate-800/90 rounded-xl p-4 text-center border border-slate-700/80">
                            <span className="text-[11px] uppercase tracking-widest text-slate-400 block">
                              Now Serving
                            </span>
                            <span className="text-5xl font-black text-teal-400 my-1 block">
                              {doc.active_token ? `#${doc.active_token.token_number}` : '—'}
                            </span>
                            <span className="text-xs text-slate-300 font-medium">
                              {doc.active_token
                                ? doc.active_token.patient_name
                                : 'Ready for next patient'}
                            </span>
                          </div>

                          <div className="flex justify-between items-center text-xs border-t border-slate-800 pt-3">
                            <div>
                              <span className="text-slate-400 block">Next in Line</span>
                              <span className="font-extrabold text-amber-400 text-sm">
                                {doc.next_token ? `#${doc.next_token.token_number}` : 'None'}
                              </span>
                            </div>
                            <div className="text-right">
                              <span className="text-slate-400 block">EWMA Avg Pace</span>
                              <span className="font-bold text-white">
                                {doc.dynamic_avg_mins}m / patient
                              </span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activePortal === 'patient_portal' && patientTab === 'heatmap' && (
                <div className={`p-6 rounded-2xl shadow-sm border space-y-5 ${surfaceCard}`}>
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 className="text-lg font-extrabold">Historical Clinic Wait-Time Heatmap</h2>
                      <p className={`text-xs ${subtleText}`}>
                        Average waiting minutes by day of week and time block to help patients pick low-traffic consultation hours
                      </p>
                    </div>

                    <div className="flex items-center gap-3 text-xs font-semibold">
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded bg-emerald-300 inline-block" /> Low (≤15m)
                      </span>
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded bg-amber-300 inline-block" /> Moderate (16–25m)
                      </span>
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded bg-rose-300 inline-block" /> Peak (&gt;25m)
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {SEED_CLINICS.map((clinic) => (
                      <div
                        key={clinic.id}
                        className={`border rounded-xl p-4 ${
                          isDark
                            ? 'border-slate-800 bg-slate-800/40'
                            : 'border-slate-200 bg-slate-50/40'
                        }`}
                      >
                        <h3 className="font-bold">{clinic.name}</h3>
                        <p className={`text-xs mb-3 ${subtleText}`}>{clinic.address}</p>

                        <table className="w-full text-center text-xs">
                          <thead>
                            <tr
                              className={`border-b ${
                                isDark
                                  ? 'text-slate-400 border-slate-700'
                                  : 'text-slate-500 border-slate-200'
                              }`}
                            >
                              <th className="py-1.5 text-left">Day</th>
                              <th className="py-1.5">9 AM – 11 AM</th>
                              <th className="py-1.5">11 AM – 1 PM</th>
                              <th className="py-1.5">5 PM – 7 PM</th>
                              <th className="py-1.5">7 PM – 9 PM</th>
                            </tr>
                          </thead>
                          <tbody
                            className={`divide-y ${
                              isDark ? 'divide-slate-800' : 'divide-slate-100'
                            }`}
                          >
                            {Object.entries(clinic.heatmap).map(([day, slots]) => (
                              <tr key={day}>
                                <td
                                  className={`py-1.5 font-bold text-left ${
                                    isDark ? 'text-slate-200' : 'text-slate-700'
                                  }`}
                                >
                                  {day}
                                </td>
                                {slots.map((mins, idx) => {
                                  const badgeStyle =
                                    mins <= 15
                                      ? isDark
                                        ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/60'
                                        : 'bg-emerald-100 text-emerald-900'
                                      : mins <= 25
                                      ? isDark
                                        ? 'bg-amber-950/80 text-amber-300 border border-amber-800/60'
                                        : 'bg-amber-100 text-amber-900'
                                      : isDark
                                      ? 'bg-rose-950/80 text-rose-300 border border-rose-800/60'
                                      : 'bg-rose-100 text-rose-900';
                                  return (
                                    <td key={idx} className="p-1">
                                      <span className={`block py-1 rounded-md font-bold ${badgeStyle}`}>
                                        {mins}m
                                      </span>
                                    </td>
                                  );
                                })}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activePortal === 'doctor_portal' && doctorTab === 'consultation' && consoleDoctor && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2">
                    <DoctorConsolePanel
                      enrichedDoctors={enrichedDoctors}
                      enrichedTokens={enrichedTokens}
                      selectedDoctorId={selectedDoctorId}
                      setSelectedDoctorId={setSelectedDoctorId}
                      onEditDoctor={handleEditDoctorFromConsole}
                      onUpdateStatusOrDelay={updateDoctorStatusOrDelay}
                      onCallNext={callNextPatient}
                      onSkipAbsent={skipAbsentPatient}
                      onRequeueAbsent={requeueAbsent}
                      onSavePrescription={savePrescription}
                      ui={ui}
                    />
                  </div>
                  <div className="space-y-5">
                    <EmergencyTriagePanel
                      selectedDoctorId={selectedDoctorId}
                      onInjectEmergency={injectEmergencyToken}
                      isDark={isDark}
                    />
                  </div>
                </div>
              )}

              {activePortal === 'doctor_portal' && doctorTab === 'roster_shifts' && (
                <DoctorShiftManagerPanel
                  enrichedDoctors={enrichedDoctors}
                  editingDoctorId={editingDoctorId}
                  setEditingDoctorId={setEditingDoctorId}
                  onUpsertDoctor={handleUpsertDoctorWithSelection}
                  onToggleDoctorShift={toggleDoctorShift}
                  onSelectDoctorForConsole={(docId) => {
                    setSelectedDoctorId(docId);
                    setDoctorTab('consultation');
                  }}
                  ui={ui}
                />
              )}

              {activePortal === 'split_demo' && consoleDoctor && (
                <div className="space-y-4">
                  <div className="bg-teal-900 text-white px-4 py-3 rounded-2xl flex flex-wrap items-center justify-between gap-2 text-xs">
                    <span>
                      <strong>Live Hackathon Split-Screen Demo:</strong> Click{' '}
                      <em>&quot;Call Next Patient&quot;</em> on the right (Doctor Console) and watch Patient A&apos;s Token #14 on the left jump from 36 mins to 24 mins with an Amber Alert!
                    </span>
                    <span className="text-teal-300 font-semibold">
                      Also syncs across separate browser windows
                    </span>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-5">
                      <PatientTrackerPanel
                        enrichedTokens={enrichedTokens}
                        trackedToken={trackedToken}
                        setTrackedTokenId={setTrackedTokenId}
                        smsLogs={store.smsLogs}
                        onMarkCheckedIn={markTokenCheckedIn}
                        ui={ui}
                      />
                    </div>
                    <div className="lg:col-span-7">
                      <DoctorConsolePanel
                        enrichedDoctors={enrichedDoctors}
                        enrichedTokens={enrichedTokens}
                        selectedDoctorId={selectedDoctorId}
                        setSelectedDoctorId={setSelectedDoctorId}
                        onEditDoctor={handleEditDoctorFromConsole}
                        onUpdateStatusOrDelay={updateDoctorStatusOrDelay}
                        onCallNext={callNextPatient}
                        onSkipAbsent={skipAbsentPatient}
                        onRequeueAbsent={requeueAbsent}
                        onSavePrescription={savePrescription}
                        ui={ui}
                      />
                    </div>
                  </div>
                </div>
              )}
            </main>

            <TokenBookingModal
              bookingDoctor={bookingDoctor}
              onClose={() => setBookingDoctor(null)}
              onConfirmBooking={handleConfirmBooking}
              ui={ui}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
